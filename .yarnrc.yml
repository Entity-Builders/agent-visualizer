nodeLinker: node-modules

# @entity-builders/* packages install from GitHub Packages.
# Requires GITHUB_PACKAGES_TOKEN (a PAT with read:packages) in the
# environment — never commit the token itself here.
npmScopes:
  entity-builders:
    npmRegistryServer: "https://npm.pkg.github.com"
    npmAlwaysAuth: true
    npmAuthToken: "${GITHUB_PACKAGES_TOKEN}"
